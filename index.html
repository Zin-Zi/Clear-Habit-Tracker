<!doctype html>
<!-- `dark` is permanent: the app is dark-theme only, there is no toggle. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NoFap Day Counter</title>
    <meta name="description" content="Simple, privacy-focused Android habit & streak counter with Jetpack Compose Material 3 design, customizable habits, relapse tracking, and an AI recovery coach." />
    <meta property="og:title" content="NoFap Day Counter" />
    <meta property="og:description" content="Simple, privacy-focused Android habit & streak counter with Jetpack Compose Material 3 design, customizable habits, relapse tracking, and an AI recovery coach." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Neutral teal placeholder favicon. A file is required because browsers
         request /favicon.ico unprompted and would otherwise log a 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232DD4BF'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none font-sans min-h-screen overflow-x-hidden" style="color-scheme: dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
